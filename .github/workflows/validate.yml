name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@3b01b02c90cd295e6a395a15255ae540848bc714 # main
    with:
      bun_version: ""
      node_version: ""
      install_command: ""
      cache_bun: false
      cache_cargo: true
      format_command: cargo fmt --all -- --check
      lint_command: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      test_command: cargo test --locked --workspace --all-features
      artifact_paths: ""

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # Reuse the exact wasm-pack executable across CI and Pages workflows.
      # Cargo installation only runs when the cache is absent or invalid.
      - name: Restore wasm-pack CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-wasm-pack-0.13.1
      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-pack >/dev/null 2>&1 || [[ "$(wasm-pack --version)" != "wasm-pack 0.13.1" ]]; then
            cargo install wasm-pack --locked --version 0.13.1 --force
          fi
          test "$(wasm-pack --version)" = "wasm-pack 0.13.1"
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check browser formatting and lint
        working-directory: web
        run: bun run format:check && bun run lint
      - name: Test browser contracts
        working-directory: web
        run: bun run test
      - name: Install browser test runtime
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Build browser MVP
        working-directory: web
        run: bun run setup
      - name: Bundle browser MVP
        working-directory: web
        run: bun run build
      - name: Build dedicated acceptance server
        run: cargo build --locked -p arpg-game-server --bin server
      - name: Verify browser workflows
        working-directory: web
        env:
          # Chromium's stderr explains renderer crashes (signal, OOM, GPU) that Playwright reports only as "Target crashed".
          DEBUG: pw:browser
        run: bun run test:browser
      - name: Keep browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-results
          path: web/test-results
          retention-days: 7
      - name: Verify build kept lockfiles unchanged
        run: git diff --exit-code -- Cargo.lock web/bun.lock

  performance-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Collect deterministic product evidence
        run: python scripts/collect_performance_evidence.py
      - name: Check out canonical Performance Evidence contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/performance-evidence
          ref: c137f34e627451817d46343eabd5cc04580db474
          path: .performance-evidence-contract
      - name: Install canonical contract validator
        run: python -m pip install -r .performance-evidence-contract/requirements-dev.txt
      - name: Validate canonical performance evidence
        run: |
          cp .artifacts/performance-evidence/arpg-product-composition.json \
            .performance-evidence-contract/fixtures/valid/arpg-product-composition.json
          python .performance-evidence-contract/scripts/validate_schema.py
      - name: Collect operation work evidence
        run: python scripts/collect_work_evidence.py --output .artifacts/performance-evidence/arpg-operation-work.json > /dev/null
      - name: Check out coding-tooling work-complexity verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/coding-tooling
          ref: d499b7f4f575e81da060a4d4f0a2eddf1e7c021a
          path: .coding-tooling-verifier
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install coding-tooling verifier
        working-directory: .coding-tooling-verifier
        run: bun install --frozen-lockfile
      - name: Verify operation work bounds
        run: |
          bun .coding-tooling-verifier/src/router.ts performance work --root . \
            --evidence .artifacts/performance-evidence/arpg-operation-work.json --json
      - name: Upload performance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arpg-performance-evidence
          include-hidden-files: true
          path: .artifacts/performance-evidence/*.json
          if-no-files-found: error
          retention-days: 14

  performance-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Enforce the blocking performance budget
        run: cargo run --locked --release -p arpg-core --features operation-work --example performance_smoke

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["rust", "web", "performance-evidence", "performance-smoke"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "web", "performance-evidence", "performance-smoke"]'
