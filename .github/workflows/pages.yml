name: pages

on:
  pull_request:
    paths:
      - "web/**"
      - "crates/arpg-core/**"
      - "crates/arpg-protocol/**"
      - "crates/arpg-web-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/arpg-core/**"
      - "crates/arpg-protocol/**"
      - "crates/arpg-web-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      # Reuse the exact wasm-pack executable across CI and Pages workflows.
      # Cargo installation only runs when the cache is absent or invalid.
      - name: Restore wasm-pack CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-wasm-pack-0.13.1
      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-pack >/dev/null 2>&1 || [[ "$(wasm-pack --version)" != "wasm-pack 0.13.1" ]]; then
            cargo install wasm-pack --locked --version 0.13.1 --force
          fi
          test "$(wasm-pack --version)" = "wasm-pack 0.13.1"
      - name: Install browser dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build playable MVP
        working-directory: web
        run: bun run setup
      - name: Bundle playable MVP
        working-directory: web
        run: bun run build
      - name: Verify build kept lockfiles unchanged
        run: git diff --exit-code -- Cargo.lock web/bun.lock
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
