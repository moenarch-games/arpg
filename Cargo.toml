[workspace]
members = [
  "crates/arpg-core",
  "crates/arpg-protocol",
  "crates/arpg-game-server",
  "crates/arpg-web-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
arpg-core = { path = "crates/arpg-core" }
arpg-protocol = { path = "crates/arpg-protocol" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "3350c6efc7abb65fd8d7ab2d78a7168bfafbbaab" }
graph-kernels = { git = "https://github.com/moritzbrantner/rust-kernels.git", rev = "45a7571890e1bbffc7f2ff5f517b5c4c7859d17c" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine.git", rev = "65e00816fa4e17c899f45d618dcdc8c40990dc00" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
wasm-bindgen = "=0.2.128"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
