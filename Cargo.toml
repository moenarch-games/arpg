[workspace]
members = [
  "crates/arpg-core",
  "crates/arpg-protocol",
  "crates/arpg-game-server",
  "crates/arpg-web-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
arpg-core = { path = "crates/arpg-core" }
arpg-protocol = { path = "crates/arpg-protocol" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "043867333bbfd880d4ef3484d57fd7199d3b6f2b" }
graph-kernels = { git = "https://github.com/moritzbrantner/rust-kernels.git", rev = "f0c248dadd8c558a24d439eec1b7b4ffd354ef82" }
rapier3d = "=0.36.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
