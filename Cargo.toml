[workspace]
members = [
  "crates/arpg-core",
  "crates/arpg-protocol",
  "crates/arpg-game-server",
  "crates/arpg-web-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
arpg-core = { path = "crates/arpg-core" }
arpg-protocol = { path = "crates/arpg-protocol" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "a87f46c6b494c8087b63ee4f47e9933c1778974b" }
graph-kernels = { git = "https://github.com/moritzbrantner/rust-kernels.git", rev = "d37842b46305c0c44bd1f8a49e09fea71929e77e" }
rapier3d = "=0.36.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
wasm-bindgen = "=0.2.128"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
